name: Liquipedia Watcher

on:
  schedule:
    - cron: "15,45 * * * *"  # at :15 and :45 each hour (offset from main bot)
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs (Liquipedia rate limits are strict)
concurrency:
  group: liquipedia-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Liquipedia watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python liquipedia_run.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add liquipedia_state.json
          git diff --cached --quiet || git commit -m "chore: update liquipedia state [skip ci]"
          git push
