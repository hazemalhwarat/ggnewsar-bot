name: GGNewsAR Bot

on:
  schedule:
    - cron: "13 */5 * * *"  # every 5 hours (00:13, 05:13, 10:13, 15:13, 20:13 UTC),
                             # offset minute to avoid GitHub's high-load congestion times.
                             # Note: the gap from 20:13 back to 00:13 is 4h, not 5h — 24
                             # doesn't divide evenly by 5, so one gap per day is shorter.
                             # This is a limitation of GitHub Actions' cron (fixed hour-of-
                             # day slots), not a bug. workflow_dispatch below still allows
                             # an on-demand run any time regardless of the schedule.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ggnewsar-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # safety net: force-kill the job if anything hangs,
                         # so a stuck run can never block future scheduled runs
                         # via the concurrency lock again
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state.json [skip ci]"
          git push
